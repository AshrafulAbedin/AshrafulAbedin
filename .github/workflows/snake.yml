name: Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AshrafulAbedin
          outputs: |
            dist/snake-light.svg?color_snake=f59e0b&color_dots=#e8d5a3,#c9a55a,#f59e0b,#d97706,#92400e
            dist/snake-dark.svg?palette=github-dark&color_snake=f59e0b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake [skip ci]"
          branch: main
